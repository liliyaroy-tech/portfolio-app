<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лилия Рой | AI-Креатор & Дизайнер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-base: #f7f5f0;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(205, 195, 180, 0.55);
      --accent: #b88655;
      --accent-soft: rgba(184, 134, 85, 0.16);
      --text: #1d1d1f;
      --text-dim: #5c5c62;
      --story-bg: #151110;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    
    body {
      background-color: var(--bg-base);
      color: var(--text);
      padding: 16px 16px 120px 16px;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    .container { 
      position: relative; 
      z-index: 10; 
      width: 100%;
    }

    header { margin-bottom: 18px; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(184, 134, 85, 0.32);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 10px;
    }
    header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2; color: #16171a; }
    header p { font-size: 14.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; font-weight: 450; }

    .about-card {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--card-border);
      padding: 16px 18px;
      margin-bottom: 22px;
      box-shadow: 0 6px 20px rgba(180, 165, 145, 0.14);
      cursor: pointer;
      user-select: none;
    }
    .about-toggle { display: flex; justify-content: space-between; align-items: center; }
    .about-toggle-title { font-size: 15px; font-weight: 700; color: #22242a; display: flex; align-items: center; gap: 8px; }
    .about-arrow { font-size: 13px; color: var(--accent); transition: transform 0.3s ease; }
    .about-card.open .about-arrow { transform: rotate(180deg); }
    
    .about-content { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.08); font-size: 14px; color: #2e3138; line-height: 1.6; }
    .about-card.open .about-content { display: block; }

    .services-list { list-style: none; margin: 10px 0; display: flex; flex-direction: column; gap: 10px; }
    .services-list li { display: flex; gap: 10px; align-items: flex-start; }
    .check-icon { color: #22a06b; font-size: 15px; font-weight: bold; flex-shrink: 0; margin-top: 1px; }
    .about-quote {
      background: #eeeae0;
      padding: 12px 14px;
      border-radius: 12px;
      border-left: 3.5px solid var(--accent);
      margin-top: 12px;
      font-size: 13px;
      color: #444750;
      line-height: 1.5;
    }

    .section-title { font-size: 17px; font-weight: 800; margin-bottom: 14px; color: #22242a; }
    .showcase-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .category-card {
      position: relative;
      background: #e2ddd5;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      cursor: pointer;
      aspect-ratio: 4/5;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      box-shadow: 0 6px 18px rgba(170, 150, 130, 0.12);
      user-select: none;
    }
    .category-card:active { transform: scale(0.97); }
    
    .category-card-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    .category-card-overlay { 
      position: absolute; 
      inset: 0; 
      background: linear-gradient(180deg, rgba(15, 17, 23, 0) 25%, rgba(15, 17, 23, 0.75) 70%, rgba(15, 17, 23, 0.95) 100%); 
      z-index: 2; 
    }
    
    .category-badge { 
      position: absolute; 
      top: 10px; 
      right: 10px; 
      z-index: 3; 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(8px); 
      font-size: 11px; 
      padding: 4px 9px; 
      border-radius: 12px; 
      font-weight: 700; 
      color: #1d1e22; 
    }
    
    .category-meta { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 3px; }
    .category-tag { font-size: 10px; color: #f0e6d2; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .category-title { font-size: 14.5px; font-weight: 800; line-height: 1.25; color: #ffffff; }

    .contact-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 24px 16px;
      background: rgba(247, 245, 240, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--card-border);
      z-index: 100;
    }
    .btn-contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--accent-soft);
      color: #9c6a3b;
      border: 1.5px solid rgba(184, 134, 85, 0.45);
      padding: 14px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(184, 134, 85, 0.12);
      cursor: pointer;
    }
    .btn-contact:active { 
      transform: scale(0.98); 
      background: rgba(184, 134, 85, 0.22);
    }

      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.65);
