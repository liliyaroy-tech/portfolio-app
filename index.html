<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лилия | AI-Креатор & Портфолио</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --accent: #ff7b54;
      --text-main: #ffffff;
      --text-sub: #9ea4b0;
      --tag-bg: rgba(255, 123, 84, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 13px; color: var(--text-sub); }
    
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid #2d313e; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .showcase-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid #262a36; cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-3px); }
    .card-media { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: #262a36; display: block; }
    .card-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
    .card-tag { font-size: 10px; color: var(--accent); background: var(--tag-bg); padding: 2px 6px; border-radius: 6px; align-self: flex-start; font-weight: 600; }
    .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; padding: 16px; align-items: center; justify-content: center; }
    .modal-content { background: var(--card-bg); border-radius: 16px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 18px; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 18px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
    .modal-img { width: 100%; border-radius: 10px; margin-bottom: 12px; aspect-ratio: 4/5; object-fit: cover; }
    .modal-desc { font-size: 12px; line-height: 1.5; color: var(--text-sub); margin-bottom: 12px; }
    .prompt-box { background: #12141a; padding: 10px; border-radius: 8px; font-size: 11px; color: #c4c9d4; font-family: monospace; line-height: 1.4; white-space: pre-wrap; }
  </style>
</head>
<body>

  <header>
    <h1>AI Showcase & Portfolio</h1>
    <p>Спорт • Анимация • Постеры</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" onclick="filterCategory(event, 'all')">Все работы</button>
    <button class="filter-btn" onclick="filterCategory(event, 'sport')">Спорт & Движение</button>
    <button class="filter-btn" onclick="filterCategory(event, 'cartoons')">Мультфильмы & Сериалы</button>
  </div>

  <div class="showcase-grid">
    <!-- Мультсериал: Лео -->
    <div class="card" data-cat="cartoons" onclick="openModal('Приключения Лео', '3D Animation / Character Sheet', 'Gemini_Generated_Image_ (2).png', 'Консистентный 3D-персонаж мальтипу Лео для серии анимационных историй.', '3D Pixar style character sheet, male maltipoo puppy Leo, fluffy apricot fur, high detail.')">
      <img class="card-media" src="Gemini_Generated_Image_ (2).png" alt="Лео">
      <div class="card-body">
        <span class="card-tag">Мультсериал</span>
        <h3 class="card-title">Приключения Лео</h3>
      </div>
    </div>

    <!-- Спорт 1 -->
    <div class="card" data-cat="sport" onclick="openModal('Спорт & Движение: Кадр 1', 'AI Art & Motion', '5321263694777882946.jpg', 'Экшн-кадр спортивной серии с проработкой кинематографичного освещения и динамики.', 'Dynamic sports action scene, intense movement, dramatic lighting, sharp focus.')">
      <img class="card-media" src="5321263694777882946.jpg" alt="Спорт 1">
      <div class="card-body">
        <span class="card-tag">Спорт & Движение</span>
        <h3 class="card-title">Экшн & Движение I</h3>
      </div>
    </div>

    <!-- Спорт 2 -->
    <div class="card" data-cat="sport" onclick="openModal('Спорт & Движение: Кадр 2', 'AI Art & Motion', '5375371130132174635 (1).jpg', 'Динамическая визуализация и композиция в спортивной тематике.', 'Athletic movement, high energy, professional color grading, cinematic composition.')">
      <img class="card-media" src="5375371130132174635 (1).jpg" alt="Спорт 2">
      <div class="card-body">
        <span class="card-tag">Спорт & Движение</span>
        <h3 class="card-title">Экшн & Движение II</h3>
      </div>
    </div>

    <!-- Спорт 3 -->
    <div class="card" data-cat="sport" onclick="openModal('Спорт & Движение: Кадр 3', 'AI Art & Motion', '5377748239911689516.jpg', 'Серия постеров: спортивная атмосфера, скорость и фиксация момента.', 'Sports poster, speed effect, vivid colors, realistic action.')">
      <img class="card-media" src="5377748239911689516.jpg" alt="Спорт 3">
      <div class="card-body">
        <span class="card-tag">Спорт & Движение</span>
        <h3 class="card-title">Экшн & Движение III</h3>
      </div>
    </div>

    <!-- Спорт 4 -->
    <div class="card" data-cat="sport" onclick="openModal('Спорт & Движение: Кадр 4', 'AI Art & Motion', '5377765299521788083.jpg', 'Энергия спорта и проработка детализации окружения.', 'Dynamic athletic poster, powerful motion, clean render, 4k.')">
      <img class="card-media" src="5377765299521788083.jpg" alt="Спорт 4">
      <div class="card-body">
        <span class="card-tag">Спорт & Движение</span>
        <h3 class="card-title">Экшн & Движение IV</h3>
      </div>
    </div>

    <!-- Спорт 5 -->
    <div class="card" data-cat="sport" onclick="openModal('Спорт & Движение: Кадр 5', 'AI Art & Motion', 'hd_ba59a11a97fefd377eb250748765c829.png', 'Концептуальный спортивный арт высокой четкости.', 'High definition sports visual, aesthetic poster style, cinematic atmosphere.')">
      <img class="card-media" src="hd_ba59a11a97fefd377eb250748765c829.png" alt="Спорт 5">
      <div class="card-body">
        <span class="card-tag">Спорт & Движение</span>
        <h3 class="card-title">Экшн & Движение V</h3>
      </div>
    </div>
  </div>

  <div id="caseModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <img id="modalImg" class="modal-img" src="" alt="Превью">
      <h2 id="modalTitle" style="font-size: 16px; margin-bottom: 6px;"></h2>
      <span id="modalTools" class="card-tag" style="margin-bottom: 12px; display: inline-block;"></span>
      <p id="modalDesc" class="modal-desc"></p>
      <div style="margin-top: 8px;">
        <strong style="font-size: 11px; color: var(--accent);">Промпт / Логика:</strong>
        <div id="modalPrompt" class="prompt-box" style="margin-top: 6px;"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    function filterCategory(e, cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      document.querySelectorAll('.card').forEach(c => {
        c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'flex' : 'none';
      });
    }

    function openModal(title, tools, imgSrc, desc, prompt) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalTools').innerText = tools;
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('modalDesc').innerText = desc;
      document.getElementById('modalPrompt').innerText = prompt;
      document.getElementById('caseModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('caseModal').style.display = 'none';
    }
  </script>
</body>
</html>
