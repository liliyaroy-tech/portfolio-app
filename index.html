<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лилия | AI-Креатор & Портфолио</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --accent: #ff7b54;
      --text-main: #ffffff;
      --text-sub: #9ea4b0;
      --tag-bg: rgba(255, 123, 84, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    header p { font-size: 13px; color: var(--text-sub); }
    
    /* Фильтры категорий */
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid #2d313e; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Сетка витрины */
    .showcase-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid #262a36; cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-3px); }
    .card-media { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: #262a36; display: block; }
    .card-body { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .card-tag { font-size: 10px; color: var(--accent); background: var(--tag-bg); padding: 2px 6px; border-radius: 6px; align-self: flex-start; font-weight: 600; }
    .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; }

    /* Попап кейса */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; padding: 20px; align-items: center; justify-content: center; }
    .modal-content { background: var(--card-bg); border-radius: 18px; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; }
    .close-btn { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 18px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .modal-img { width: 100%; border-radius: 12px; margin-bottom: 14px; }
    .modal-desc { font-size: 13px; line-height: 1.5; color: var(--text-sub); margin-bottom: 16px; }
    .prompt-box { background: #12141a; padding: 12px; border-radius: 10px; font-size: 12px; color: #c4c9d4; font-family: monospace; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <h1>AI Showcase & Portfolio</h1>
    <p>Анимация • Сериалы • Праздничный арт</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" onclick="filterCategory('all')">Все работы</button>
    <button class="filter-btn" onclick="filterCategory('posters')">Постеры</button>
    <button class="filter-btn" onclick="filterCategory('cartoons')">Мультфильмы & Сериалы</button>
  </div>

  <div class="showcase-grid">
    <!-- Кейс 1: 1 Сентября -->
    <div class="card" data-cat="posters" onclick="openModal('1 Сентября: Айдентика', 'ChatGPT + Nano Banana Pro', 'Разработка реалистичного персонажа в контрасте с воздушной акварельной типографикой.', 'Вертикальная иллюстрация 4:5. Реалистичный школьник на книгах / акварельный полет.')">
      <img class="card-media" src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=600" alt="1 Сентября">
      <div class="card-body">
        <span class="card-tag">ChatGPT • Art</span>
        <h3 class="card-title">1 Сентября: Сменка</h3>
      </div>
    </div>

    <!-- Кейс 2: Мультфильм Лео -->
    <div class="card" data-cat="cartoons" onclick="openModal('Сериал про Лео', '3D Animation / Runway', 'Серия коротких эпизодов с сохранением единого консистентного персонажа.', '3D Pixar style character sheet, dynamic scenes, storyline integration.')">
      <img class="card-media" src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=600" alt="Лео">
      <div class="card-body">
        <span class="card-tag">Мультсериал</span>
        <h3 class="card-title">Приключения Лео</h3>
      </div>
    </div>
  </div>

  <div id="caseModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h2 id="modalTitle" style="font-size: 18px; margin-bottom: 6px;"></h2>
      <span id="modalTools" class="card-tag" style="margin-bottom: 14px; display: inline-block;"></span>
      <p id="modalDesc" class="modal-desc"></p>
      <div style="margin-top: 10px;">
        <strong style="font-size: 12px; color: var(--accent);">Промпт / Логика:</strong>
        <div id="modalPrompt" class="prompt-box" style="margin-top: 6px;"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.card').forEach(c => {
        c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'flex' : 'none';
      });
    }

    function openModal(title, tools, desc, prompt) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalTools').innerText = tools;
      document.getElementById('modalDesc').innerText = desc;
      document.getElementById('modalPrompt').innerText = prompt;
      document.getElementById('caseModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('caseModal').style.display = 'none';
    }
  </script>
</body>
</html>
