<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лилия | AI-Креатор & Портфолио</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --accent: #ff7b54;
      --text-main: #ffffff;
      --text-sub: #9ea4b0;
      --tag-bg: rgba(255, 123, 84, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 13px; color: var(--text-sub); }
    
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn { background: var(--card-bg); color: var(--text-sub); border: 1px solid #2d313e; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .showcase-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid #262a36; cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-3px); }
    .card-media { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: #262a36; display: block; }
    .card-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
    .card-tag { font-size: 10px; color: var(--accent); background: var(--tag-bg); padding: 2px 6px; border-radius: 6px; align-self: flex-start; font-weight: 600; }
    .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 100; padding: 16px; align-items: center; justify-content: center; }
    .modal-content { background: var(--card-bg); border-radius: 16px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 18px; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 18px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
    .modal-img { width: 100%; border-radius: 10px; margin-bottom: 12px; aspect-ratio: 4/5; object-fit: cover; }
    .modal-desc { font-size: 12px; line-height: 1.5; color: var(--text-sub); margin-bottom: 12px; }
    .prompt-box { background: #12141a; padding: 10px; border-radius: 8px; font-size: 11px; color: #c4c9d4; font-family: monospace; line-height: 1.4; white-space: pre-wrap; }
  </style>
</head>
<body>

  <header>
    <h1>AI Showcase & Portfolio</h1>
    <p>Постеры • Анимация • AI-дизайн</p>
  </header>

  <div class="filters">
    <button class="filter-btn active" onclick="filterCategory(event, 'all')">Все работы</button>
    <button class="filter-btn" onclick="filterCategory(event, 'posters')">Постеры</button>
    <button class="filter-btn" onclick="filterCategory(event, 'cartoons')">Мультфильмы & Сериалы</button>
  </div>

  <div class="showcase-grid">
    <!-- Постер 1: Экшн на трассе -->
    <div class="card" data-cat="posters" onclick="openModal('Картинг: Экшн на трассе', 'AI Visuals & Photoshop', '5321263694777882946.jpg', 'Спортивный постер с интеграцией пилота Дмитрия Романова, динамикой движения карта и закатным освещением.', 'Karting action poster, young driver, dynamic motion blur, dramatic sunset lighting, high resolution.')">
      <img class="card-media" src="5321263694777882946.jpg" alt="Картинг: Экшн на трассе">
      <div class="card-body">
        <span class="card-tag">Постер</span>
        <h3 class="card-title">Экшн на трассе</h3>
      </div>
    </div>

    <!-- Мультсериал: Лео -->
    <div class="card" data-cat="cartoons" onclick="openModal('Приключения Лео', '3D Animation / Character Sheet', 'Gemini_Generated_Image_ (2).png', 'Консистентный 3D-персонаж мальтипу Лео для серии анимационных историй.', '3D Pixar style character sheet, male maltipoo puppy Leo, fluffy apricot fur, high detail.')">
      <img class="card-media" src="Gemini_Generated_Image_ (2).png" alt="Лео">
      <div class="card-body">
        <span class="card-tag">Мультсериал</span>
        <h3 class="card-title">Приключения Лео</h3>
      </div>
    </div>

    <!-- Постер 2: Кубок СПб -->
    <div class="card" data-cat="posters" onclick="openModal('Картинг: Кубок Санкт-Петербурга', 'AI Design & Typography', '5375371130132174635 (1).jpg', 'Афиша к этапу соревнований по картингу: акцидентная типографика, схема картодрома Ижорец и презентация пилота.', 'Professional sports event poster layout, racing driver in race suit, typography, track layout scheme.')">
      <img class="card-media" src="5375371130132174635 (1).jpg" alt="Кубок СПб">
      <div class="card-body">
        <span class="card-tag">Постер</span>
        <h3 class="card-title">Кубок СПб: Афиша</h3>
      </div>
    </div>

    <!-- Постер 3: Нацелен на победу -->
    <div class="card" data-cat="posters" onclick="openModal('Картинг: Нацелен на победу', 'AI Concept & Poster Art', '5377748239911689516.jpg', 'Эмоциональный постер со шлемом и картом #29 на контрастном гоночном фоне.', 'Motorsport poster design, driver helmet with reflections, high energy graphic composition.')">
      <img class="card-media" src="5377748239911689516.jpg" alt="Нацелен на победу">
      <div class="card-body">
        <span class="card-tag">Постер</span>
        <h3 class="card-title">Нацелен на победу</h3>
      </div>
    </div>

    <!-- Постер 4: Скорость и Драйв -->
    <div class="card" data-cat="posters" onclick="openModal('Картинг: Скорость и Драйв', 'AI Visuals & Retouch', '5377765299521788083.jpg', 'Композиционный постер гоночной академии SNC: акцент на динамике и скорости болида.', 'Karting racer in dynamic angle, cinematic color palette, high speed visual effect.')">
      <img class="card-media" src="5377765299521788083.jpg" alt="Скорость и Драйв">
      <div class="card-body">
        <span class="card-tag">Постер</span>
        <h3 class="card-title">Скорость и Драйв</h3>
      </div>
    </div>

    <!-- Постер 5: Волейбол -->
    <div class="card" data-cat="posters" onclick="openModal('Волейбол: Атака над сеткой', 'AI Art & Sports Poster', 'hd_ba59a11a97fefd377eb250748765c829.png', 'Динамичный постер волейбольного матча на заполненной арене: прыжок, фиксация мяча в воздухе и атмосферный стадионный свет.', 'Volleyball player jumping at the net, powerful spike motion, indoor stadium arena, cinematic lighting, flying volleyballs, 8k.')">
      <img class="card-media" src="hd_ba59a11a97fefd377eb250748765c829.png" alt="Волейбол: Атака над сеткой">
      <div class="card-body">
        <span class="card-tag">Постер</span>
        <h3 class="card-title">Атака над сеткой</h3>
      </div>
    </div>
  </div>

  <div id="caseModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <img id="modalImg" class="modal-img" src="" alt="Превью">
      <h2 id="modalTitle" style="font-size: 16px; margin-bottom: 6px;"></h2>
      <span id="modalTools" class="card-tag" style="margin-bottom: 12px; display: inline-block;"></span>
      <p id="modalDesc" class="modal-desc"></p>
      <div style="margin-top: 8px;">
        <strong style="font-size: 11px; color: var(--accent);">Промпт / Логика:</strong>
        <div id="modalPrompt" class="prompt-box" style="margin-top: 6px;"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    function filterCategory(e, cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      document.querySelectorAll('.card').forEach(c => {
        c.style.display = (cat === 'all' || c.dataset.cat === cat) ? 'flex' : 'none';
      });
    }

    function openModal(title, tools, imgSrc, desc, prompt) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalTools').innerText = tools;
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('modalDesc').innerText = desc;
      document.getElementById('modalPrompt').innerText = prompt;
      document.getElementById('caseModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('caseModal').style.display = 'none';
    }
  </script>
</body>
</html>
